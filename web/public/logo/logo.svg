<svg width="200px" height="200px" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f0f0f0" />
  <!-- Circles and shapes for a soft, tech-inspired look -->
  <circle cx="100" cy="50" r="40" fill="#b3e5fc" />
  <circle cx="60" cy="140" r="30" fill="#ffcdd2" />
  <circle cx="150" cy="130" r="50" fill="#e1bee7" />
  <!-- Optional: Additional geometric shapes to suggest connectivity or network -->
  <polygon points="100,10 120,45 80,45" fill="#c8e6c9" />
  <rect x="130" y="30" width="40" height="40" fill="#fff9c4" transform="rotate(45 150 50)" />
</svg>
